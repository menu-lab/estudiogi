
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Studio Gi Pilates - Menú Interactivo</title>

  <!-- Favicon Oficial 32x32 px (Isotipo G-i en oro/bronce sobre fondo blanco puro) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' width='32' height='32'%3E%3Crect width='32' height='32' fill='%23ffffff'/%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%23b58a3e' stroke-width='1.5'/%3E%3Cpath d='M10 12 Q16 6 22 11 Q24 16 21 21' fill='none' stroke='%23b58a3e' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='19' cy='9.5' r='1.4' fill='%23b58a3e'/%3E%3Cpath d='M20 14 A 6.5 6.5 0 1 0 20 21 H 16' fill='none' stroke='%232b3b44' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #e5ded5;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Contenedor responsivo continuo 900x1700 */
    .app-container {
      position: relative;
      height: 100vh;
      height: 100dvh;
      width: calc(100dvh * (900 / 1700));
      max-width: 100vw;
      aspect-ratio: 900 / 1700;
      background-image: url('menu.jpg');
      background-position: center center;
      background-repeat: no-repeat;
      background-size: 100% 100%;
      overflow: hidden;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.22);
    }

    /* Reproductor / Botón de Música de Fondo (Superior Izquierda) */
    #soundToggle {
      position: absolute;
      top: 1.8%;
      left: 3.5%;
      width: 9%;
      height: 5%;
      z-index: 40;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(4px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      transition: transform 0.15s ease;
    }

    #soundToggle:active {
      transform: scale(0.92);
    }

    #soundIcon {
      width: 58%;
      height: 58%;
      fill: #8c6d37;
      transition: opacity 0.2s ease, fill 0.2s ease;
    }

    #soundToggle.muted #soundIcon {
      opacity: 0.45;
      fill: #888888;
    }

    /* Botones táctiles transparentes interactivos */
    .touch-btn {
      position: absolute;
      display: block;
      cursor: pointer;
      text-decoration: none;
      border-radius: 50px;
      z-index: 25;
      background: transparent;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .touch-btn:active {
      transform: scale(0.985);
      background-color: rgba(181, 138, 62, 0.15);
    }

    /* Coordenadas precisas calibradas sobre menu.jpg */
    /* 1. Agenda tu Clase */
    .btn-agenda {
      top: 32.8%;
      left: 10.5%;
      width: 79%;
      height: 7.2%;
    }

    /* 2. Contáctanos y Conversemos (WhatsApp) */
    .btn-whatsapp {
      top: 43.6%;
      left: 10.5%;
      width: 79%;
      height: 8.6%;
    }

    /* 3. Nuestro Estudio & Web */
    .btn-web {
      top: 54.8%;
      left: 10.5%;
      width: 79%;
      height: 8.6%;
    }

    /* 4. Síguenos en Instagram */
    .btn-instagram {
      top: 66.2%;
      left: 10.5%;
      width: 79%;
      height: 8.6%;
    }

    /* 5. Footer Fijo: Dirección y Geolocalización (Edificio 2) */
    .btn-ubicacion {
      top: 79.2%;
      left: 4%;
      width: 92%;
      height: 11.2%;
      border-radius: 40px;
    }

    .btn-ubicacion:active {
      background-color: rgba(181, 138, 62, 0.22);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Pista de Audio Zen / Ambiente Pilates -->
    <audio id="bgMusic" loop preload="auto" src="musica_studiogi.mp3"></audio>

    <!-- Botón Toggle de Sonido -->
    <div id="soundToggle" class="muted" title="Activar/Desactivar Música">
      <svg id="soundIcon" viewBox="0 0 24 24">
        <!-- Icono mudo inicial -->
        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27l4.73 4.73H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
      </svg>
    </div>

    <!-- Botón 1: Agenda tu Clase (Plataforma Externa de Reservas) -->
    <a href="https://studiogi.cl" target="_blank" rel="noopener" class="touch-btn btn-agenda" title="Agenda tu Clase"></a>

    <!-- Botón 2: Contáctanos y Conversemos (WhatsApp Directo y Amable) -->
    <a href="https://wa.me/56993001478?text=%C2%A1Hola%20Studio%20Gi!%20Me%20gustar%C3%ADa%20conversar%20con%20ustedes%20sobre%20sus%20clases%20de%20Pilates%20y%20resolver%20algunas%20dudas.%20Mi%20nombre%20es:%20" target="_blank" rel="noopener" class="touch-btn btn-whatsapp" title="Contáctanos y Conversemos"></a>

    <!-- Botón 3: Nuestro Estudio & Web -->
    <a href="https://studiogi.cl" target="_blank" rel="noopener" class="touch-btn btn-web" title="Nuestro Estudio y Web"></a>

    <!-- Botón 4: Síguenos en Instagram -->
    <a href="https://www.instagram.com/studio.gi.pilates" target="_blank" rel="noopener" class="touch-btn btn-instagram" title="Instagram @studio.gi.pilates"></a>

    <!-- Botón 5: Footer Ubicación Google Maps (Av. Las Condes 12523 Local 5, Edificio 2 Interior) -->
    <a href="https://www.google.com/maps/search/?api=1&query=Av.+Las+Condes+12523+Local+5,+Las+Condes,+Santiago" target="_blank" rel="noopener" class="touch-btn btn-ubicacion" title="Cómo llegar al Local 5 (Edificio 2, Interior)"></a>
  </div>

  <script>
    // Control de audio interactivo
    const audio = document.getElementById('bgMusic');
    const soundToggle = document.getElementById('soundToggle');
    const soundIcon = document.getElementById('soundIcon');

    const iconMuted = 'M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27l4.73 4.73H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z';
    const iconActive = 'M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z';

    soundToggle.addEventListener('click', () => {
      if (audio.paused) {
        audio.play().then(() => {
          soundToggle.classList.remove('muted');
          soundIcon.innerHTML = `<path d="${iconActive}"/>`;
        }).catch(err => console.warn(err));
      } else {
        audio.pause();
        soundToggle.classList.add('muted');
        soundIcon.innerHTML = `<path d="${iconMuted}"/>`;
      }
    });
  </script>
</body>
</html>
